<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ProfeGPT</title>
  <meta name="description" content="Spanish, French and Italian: a translator, full conjugation tables, a dictionary and a tutor for each." />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
  <script>
    // Runs before the first paint so the page never flashes the wrong palette.
    (function () {
      // The chrome is either English or whichever language the site is about.
      // The subject is the first part of the address — /es, /fr, /it — and the
      // bare / is the home page, which opens on Spanish. It goes on the root
      // element here because the wallpaper is chosen in CSS and has to be
      // right before the first paint.
      var first = window.location.pathname.split('/')[1];
      var study = first === 'fr' || first === 'it' ? first : 'es';
      document.documentElement.dataset.study = study;
      if (window.location.pathname === '/' || window.location.pathname === '') {
        document.documentElement.classList.add('is-home');
      }
      try {
        document.documentElement.lang = localStorage.getItem('profegpt:lang') === 'en' ? 'en' : study;
      } catch (e) { document.documentElement.lang = study; }
      var stored = null;
      try { stored = localStorage.getItem('profegpt:theme'); } catch (e) {}
      var system = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      document.documentElement.dataset.theme = stored === 'light' || stored === 'dark' ? stored : system;
    })();
  </script>
</head>
<body>
  <a class="skip-link" href="#main">Saltar al contenido</a>

  <header class="nav" id="nav">
    <a class="nav__brand" href="/" data-link>
      <span class="nav__wordmark">ProfeGPT</span>
    </a>
    <nav class="nav__links" aria-label="Principal">
      <a href="/es#traductor" data-link data-nav="traductor">Traductor</a>
      <a href="/es/conjugacion" data-link data-nav="conjugacion">Conjugación</a>
      <a href="/es/diccionario" data-link data-nav="diccionario">Diccionario</a>
      <a href="/es/chat" data-link data-nav="chat">Chat</a>
    </nav>
    <div class="langswitch" role="group"></div>
    <button class="nav__toggle" type="button" aria-label="Abrir menú" aria-expanded="false">
      <span></span><span></span>
    </button>
    <div class="nav__end"></div>
  </header>

  <main id="main"></main>

  <footer class="footer">
    <p>ProfeGPT</p>
  </footer>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
