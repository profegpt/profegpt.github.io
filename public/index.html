<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ProfeGPT</title>
  <meta name="description" content="Traductor español ↔ inglés, tablas de conjugación completas, diccionario de la RAE y un tutor con IA." />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
  <script>
    // Runs before the first paint so the page never flashes the wrong palette.
    (function () {
      try {
        var l = localStorage.getItem('profegpt:lang');
        document.documentElement.lang = l === 'en' ? 'en' : 'es';
      } catch (e) {}
      var stored = null;
      try { stored = localStorage.getItem('profegpt:theme'); } catch (e) {}
      var system = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      document.documentElement.dataset.theme = stored === 'light' || stored === 'dark' ? stored : system;
    })();
  </script>
</head>
<body>
  <a class="skip-link" href="#main">Saltar al contenido</a>

  <header class="nav" id="nav">
    <button class="nav__lock" type="button" aria-label="Bloquear la web"></button>
    <a class="nav__brand" href="/" data-link>
      <span class="nav__wordmark">ProfeGPT</span>
    </a>
    <nav class="nav__links" aria-label="Principal">
      <a href="/#traductor" data-link data-nav="traductor">Traductor</a>
      <a href="/conjugacion" data-link data-nav="conjugacion">Conjugación</a>
      <a href="/diccionario" data-link data-nav="diccionario">Diccionario</a>
      <a href="/chat" data-link data-nav="chat">Chat</a>
    </nav>
    <div class="langswitch" role="group"></div>
    <button class="nav__theme" type="button" aria-label="Cambiar de tema"></button>
    <button class="nav__toggle" type="button" aria-label="Abrir menú" aria-expanded="false">
      <span></span><span></span>
    </button>
  </header>

  <main id="main"></main>

  <footer class="footer">
    <p>ProfeGPT · definiciones del <a href="https://dle.rae.es" target="_blank" rel="noopener">Diccionario de la lengua española</a> (RAE)</p>
  </footer>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
