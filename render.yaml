# Render Blueprint — https://render.com/docs/blueprint-spec
#
# ProfeGPT is a Node server, not a static site: the dictionaries, the
# translator, pronunciation and the teacher's lock all need it. GitHub Pages and Netlify's
# static hosting cannot run it.
#
# Two things here are not defaults and matter:
#
#   numInstances: 1 — the teacher's lock and the dictionary caches are held
#   in memory. A second instance gets its own copy of each, so a locked room
#   would be unlocked for half the class.
#
#   Every key is `sync: false`, which means Render holds the value and this file
#   only names it. Nothing secret belongs in a file that is in a repository,
#   private or not.
#
#   Three were once written out in full here — DeepL, ElevenLabs and a contact
#   address. The history has since been rewritten to remove them, but the repo
#   was public while they were in it, so those keys are treated as spent: they
#   were rotated, and the old ones are worthless.
services:
  - type: web
    name: profegpt
    runtime: node
    plan: free
    region: oregon
    numInstances: 1
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"

      # CHANGE THIS. The default is in the source, so anyone who can read the
      # repository can seal the site.
      - key: TEACHER_PASSCODE
        sync: false

      # Get one. Anonymous access to rae-api.com is 100 lookups a day, which a
      # single class exhausts before lunch. Free at https://rae-api.com/login
      - key: RAE_API_KEY
        sync: false

      # The translator — the only one. Free tier is 500k characters a month.
      # Only a free key (ending :fx) is used; a Pro key is billed, so the
      # server ignores it. Without one the translator says it is unavailable.
      - key: DEEPL_API_KEY
        sync: false

      # Pronunciation on the dictionary page. Free tier is 10,000 characters a
      # month for the whole site, so clips are cached and only single words are
      # ever spoken. Without it the speaker button removes itself. Use a free
      # account: with no card on file it refuses past the limit, never charges.
      - key: ELEVENLABS_API_KEY
        sync: false
      # Optional: a premade voice id. Defaults to "Alice", a clear educator
      # voice. A free account cannot use voice-library voices.
      - key: ELEVENLABS_VOICE_ID
        sync: false
