# Render Blueprint — https://render.com/docs/blueprint-spec
#
# ProfeGPT is a Node server, not a static site: the chat, both dictionaries, the
# translator and the teacher's lock all need it. GitHub Pages and Netlify's
# static hosting cannot run it.
#
# Two things here are not defaults and matter:
#
#   numInstances: 1 — the allowance, the teacher's lock and the dictionary
#   caches are all held in memory. A second instance gets its own copy of each,
#   so a locked room would be unlocked for half the class and everyone's free
#   questions would double.
#
#   Every key is `sync: false`, which means Render holds the value and this file
#   only names it. Nothing secret belongs in a file that is in a repository,
#   private or not.
#
#   Three of them were written out in full for a while — DeepL, ElevenLabs and
#   the MyMemory address — and git history keeps what a file once held. Removing
#   the lines hides them from the current checkout and from nothing else, so
#   those three want rotating whenever it is convenient.
services:
  - type: web
    name: profegpt
    runtime: node
    plan: free
    region: oregon
    numInstances: 1
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"

      # Keeps browser identities — and therefore each visitor's allowance —
      # across a restart. Without it a restart hands everybody a fresh five.
      - key: SESSION_SECRET
        generateValue: true

      # Behind Render's load balancer, so X-Forwarded-For can be believed.
      - key: TRUST_PROXY
        value: "1"

      # CHANGE THESE. The defaults are in the source, so anyone who can read the
      # repository can seal the site or help themselves to French and Latin.
      - key: TEACHER_PASSCODE
        sync: false
      # Opens French and Latin for the browser that types it. Per-browser:
      # the server keeps no state for it.
      - key: RELEASE_PASSCODE
        sync: false

      # Get one. Anonymous access to rae-api.com is 100 lookups a day, which a
      # single class exhausts before lunch. Free at https://rae-api.com/login
      - key: RAE_API_KEY
        sync: false

      # Translation. The public Lingva instances are volunteer-run and several
      # are behind a Cloudflare challenge; point this at one that answers, or
      # at a self-hosted one. Without a working instance, French and Latin
      # translation fall to MyMemory alone — see the README.
      - key: LINGVA_INSTANCES
        sync: false

      # MyMemory rations anonymous use by IP, and Render's is shared with
      # whatever else it is running — which is why translation worked locally
      # and answered 429 here. Naming a contact address is MyMemory's own way
      # of asking for the larger allowance, 1,000 → 10,000 words a day. It is
      # sent to MyMemory with every request.
      - key: MYMEMORY_EMAIL
        sync: false

      # The best translator in the chain, and the first one asked. Free tier is
      # 500k characters a month. Only a free key (ending :fx) is used; a Pro
      # key is billed, so the server ignores it. Without one French and
      # Spanish fall to the model, and then to MyMemory.
      - key: DEEPL_API_KEY
        sync: false

      # Pronunciation on the dictionary page. Free tier is 10,000 characters a
      # month for the whole site, so clips are cached and only single words are
      # ever spoken. Without it the speaker button removes itself. Use a free
      # account: with no card on file it refuses past the limit, never charges.
      - key: ELEVENLABS_API_KEY
        sync: false
      # Optional: a premade voice id. Defaults to "Alice", a clear educator
      # voice. A free account cannot use voice-library voices.
      - key: ELEVENLABS_VOICE_ID
        sync: false

      # Free tiers only; a paid provider is refused in code. Create the keys
      # where billing is off — a Gemini key from a billed Cloud project would
      # be charged, and code cannot see that. Off-topic chat only. Everything about the languages themselves is
      # answered from the site's own data and needs no key at all.
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
